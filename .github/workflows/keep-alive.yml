name: Keep backend alive

# Render's free plan spins the web service down after ~15min with no
# inbound traffic. The backend's own selfPing cron can't prevent that —
# it only runs while the process is already up, so once the instance is
# asleep, nothing internal (including scheduled reports) fires again
# until an external request wakes it. This workflow is that external ping.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 25 https://rovx-backend-up1u.onrender.com/api/v1/health
