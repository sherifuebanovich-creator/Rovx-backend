name: Keep backend alive

# Render's free plan spins the web service down after ~15min with no
# inbound traffic. The backend's own selfPing cron can't prevent that —
# it only runs while the process is already up, so once the instance is
# asleep, nothing internal (including scheduled reports) fires again
# until an external request wakes it. This workflow is that external ping.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# A worst-case retry run (--retry-max-time 780 below, ~13min) outlives the
# 10-minute cron interval, so without this the next scheduled run can start
# while the previous one is still retrying — two runs hammering the same
# waking instance at once and burning CI minutes twice for one wake cycle.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Render's free-tier cold start is usually 30-60s+, but a genuinely
        # cold instance (asleep long enough that the DB pool/Redis/Nest
        # bootstrap all have to reconnect from scratch) has been observed
        # taking well over 90s with zero bytes back before it starts
        # responding — the previous 90s x 4 attempts (~6min total) budget
        # was exactly what one such run needed and didn't have. --retry
        # survives a cold start that's still booting when an attempt's
        # connection is refused/times out; the widened budget below covers
        # a slow wake instead of just a normal one.
        run: curl -fsS --max-time 150 --retry 5 --retry-delay 10 --retry-connrefused --retry-max-time 780 https://rovx-backend-up1u.onrender.com/api/v1/health
