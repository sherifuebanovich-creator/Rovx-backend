name: Keep backend alive

# Render's free plan spins the web service down after ~15min with no
# inbound traffic. The backend's own selfPing cron can't prevent that —
# it only runs while the process is already up, so once the instance is
# asleep, nothing internal (including scheduled reports) fires again
# until an external request wakes it. This workflow is that external ping.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Render's free-tier cold start can take 30-60s+. A short timeout here
        # fails the exact moment the ping is needed most (waking a sleeping
        # instance), leaving the backend asleep for hours until the next lucky
        # run lands while it's already awake. --retry survives a cold start
        # that's still booting when the first attempt's connection is refused.
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 5 --retry-connrefused https://rovx-backend-up1u.onrender.com/api/v1/health
